# Written by `verdog-standards sync` from verdog-ai/standards; edit it there.
line-length = 80
target-version = "py312"
# The examples of the standards violate their rules on purpose.
# Imported workflows (external/) and the generated declarations (__init__.py)
# belong to their own repositories and to the Verdog compiler.
extend-exclude = ["standards/languages/*/examples", "external", "**/__init__.py"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "TID252", "D"]
ignore = ["UP040", "UP046", "UP047"]

# The formatter keeps code at 80 columns; strings and comments it cannot wrap
# may reach 100.
[lint.pycodestyle]
max-line-length = 100

[lint.pydocstyle]
convention = "google"

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.per-file-ignores]
# Test names and assertions document the behavior; helpers need no public API docs.
"**/tests/**" = ["D"]
"**/test_*.py" = ["D"]
# Verdog scaffolds each impl.py and values.py: they import their generated
# declarations relatively, and the graph documents their State, Payload,
# Params and visit.
"**/impl.py" = ["TID252", "D100", "D101", "D103"]
"**/values.py" = ["TID252", "D100", "D101"]

[format]
docstring-code-format = true
